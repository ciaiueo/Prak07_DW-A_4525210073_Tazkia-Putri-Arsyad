<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Penerimaan Mahasiswa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>Penerimaan Mahasiswa Baru</h1>
        <p>Silakan lengkapi data diri calon mahasiswa.</p>

        <form action="#" method="post">

            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama"
                   placeholder="Masukkan nama lengkap" required>

            <label for="email">Alamat Email</label>
            <input type="email" id="email" name="email"
                   placeholder="Masukkan alamat email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Buat password" required>

            <label for="nilai">Nilai</label>
            <input type="number" id="nilai" name="nilai"
                   placeholder="Masukkan nilai" min="0" max="100" required>

            <label for="tanggal_lahir">Tanggal Lahir</label>
            <input type="date" id="tanggal_lahir" name="tanggal_lahir"
                   required>

            <div class="buttons">
                <button type="submit">Kirim Pendaftaran</button>
                <button type="reset">Hapus Data</button>
                <button type="button" onclick="alert('Silakan periksa kembali data Anda!')">
                    Periksa Data
                </button>
            </div>

        </form>

        <a href="index.html">Kembali ke Form Pendaftaran Kursus</a>
    </div>

</body>
</html>
