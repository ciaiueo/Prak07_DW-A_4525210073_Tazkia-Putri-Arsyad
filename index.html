<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Kursus</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>Form Pendaftaran Kursus</h1>
        <p>Silakan isi data diri untuk mendaftar kursus.</p>

        <form action="#" method="post">

            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama"
                   placeholder="Masukkan nama lengkap" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="Masukkan email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Masukkan password" required>

            <label for="umur">Umur</label>
            <input type="number" id="umur" name="umur"
                   placeholder="Masukkan umur" required>

            <label for="tanggal">Tanggal Lahir</label>
            <input type="date" id="tanggal" name="tanggal"
                   required>

            <label for="telepon">Nomor Telepon</label>
            <input type="tel" id="telepon" name="telepon"
                   placeholder="Masukkan nomor telepon">

            <div class="buttons">
                <button type="submit">Daftar</button>
                <button type="reset">Reset</button>
                <button type="button" onclick="alert('Silakan periksa kembali data pendaftaran Anda!')">
                    Periksa Data
                </button>
            </div>

        </form>

        <a href="mahasiswa.html">Lihat Form Penerimaan Mahasiswa</a>
    </div>

</body>
</html>
